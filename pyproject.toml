[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-memory-manager"
version = "0.2.0"
description = "Local tiered memory manager for extending LLM context windows"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "gmic" }]
keywords = [
    "llm", "memory", "context", "ollama", "lmstudio", "localai",
    "tiered-memory", "rag", "context-window", "local-ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.scripts]
memory-manager-mcp = "memory_manager.mcp_server:main"
memory-manager-proxy = "memory_manager.proxy:main"

[project.urls]
Homepage = "https://github.com/gmic/memory_manager"
Repository = "https://github.com/gmic/memory_manager"
Issues = "https://github.com/gmic/memory_manager/issues"

[project.optional-dependencies]
keyring = ["keyring>=24.0"]
encrypt = ["cryptography>=42.0"]
chroma = ["chromadb>=0.5"]
mcp = ["mcp>=2.0"]
all = ["keyring>=24.0", "cryptography>=42.0", "chromadb>=0.5", "mcp>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["memory_manager", "services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
